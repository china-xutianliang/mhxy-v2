# 说明
#   - 这是 0→1 重构的新数据,旧的 resources/nav/{maps,flags,fallback_graph}.yaml 与 src/core/nav 已删除。
#   - panel_hint: 旧 maps.yaml 里 7 座主城的"小地图大小"旧值(像素,未知是物理像素还是逻辑像素),
#                 只作自动标定的初值,不要当真值;真值以标定结果(map_panels.yaml)为准。
#   - 键 = 游戏左上角显示的场景名(OCR 校验用)。alias = OCR 可能读成的别名。
#   - size   : 场景最大坐标 [宽,高](游戏内坐标,不是像素)。null = 待填。
#   - tab    : 是否可以 Tab 打开小地图并点击寻路。true/false/null(待现场确认)。室内通常 false。
#   - kind   : city 主城 | field 野外 | sect 门派 | sect_hall 门派室内/大殿 | maze 迷宫/多层
#              interior 城内室内 | guild 帮派 | instance 副本/活动(默认不入规划)
#   - conf   : 来源可信度  A=官方页明确  B=多份攻略一致  C=推测/名称待现场确认
#   - 所有 size 只有 7 座主城有旧参考值(与旗点攻略最大坐标吻合),其余均需用户填写。
#   - 「待核」= 公开资料没有给出确切名称/是否存在,请进游戏确认后删除或改名。
#   - 未经真机验证的内容一律不要当作事实。

