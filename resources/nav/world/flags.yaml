# 使用旗子的界面(一次性标定, 你提供截图后填)
flag_ui:
  open_by: null                 # 背包右键 / 快捷栏 / 快捷键
  point_pick: null              # 点红点即飞 / 点后需确认 (待核; 公开资料说"点想去的红点")
  confirm_button: null          # 若需确认, 按钮模板
  count_roi: null               # 悬停后显示剩余次数的文字区域 [x,y,w,h]
  count_text_pattern: null      # 如 "剩余(\d+)次" 待核
  total_uses_per_flag: 140      # 五色旗盒合成旗 140 次(公开资料, 待核)
  low_warn: 21                  # <21 提示补充
  low_stop: 1                   # <1 规划不再用旗

# 飞行符(罗道人 500 两/张): 使用后弹出选城界面"想去哪个主城点一下"
charm:
  item_name: null               # 道具名, 待核(飞行符)
  icon_template: null
  dests:                        # 用户确认: 不含长安、长寿
    建邺城:   {ui: null, arrive: null}   # ui=选城界面里该城按钮的像素位置; arrive=飞到后的落脚坐标
    西梁女国: {ui: null, arrive: null}
    傲来国:   {ui: null, arrive: null}
    朱紫国:   {ui: null, arrive: null}
    宝象国:   {ui: null, arrive: null}
  vendor: {npc: 罗道人, where: "长安 (505,74)/(265,46)/(326,151) 公开资料, 待核", price: 500}
