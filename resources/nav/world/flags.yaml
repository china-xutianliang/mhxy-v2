# 第三层·导标旗(骨架)
# 用户已确认: 长安城 红/蓝 两面, 朱紫国 浅黄, 傲来国 黄, 长寿村 绿; 每面 7 个点位, 共 5 面 35 点。
# 点位是你**自己账号实际插下的坐标**(合成旗里每个点位=你插旗时的位置), 不同账号可能略有偏差,
# 所以本文件按账号/区覆盖: 默认值在这里, 账号差异写进 flags.<账号>.yaml (同结构, 只写不同的点)。
#
# xy        : 该点位在对应城市内的游戏坐标 [x,y]; 你填。
# ui        : 使用旗子后弹出的选点界面里, 该点位的红点在**游戏画面**的像素位置 [x,y] (800×600 逻辑坐标); 你填或由录制得到。
# near      : 附近的传送圈/NPC/建筑(便于人读), 可选。
# 剩余次数不写在这里, 运行时从游戏里读(悬停/物品栏数字)。

