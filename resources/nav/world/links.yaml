# 第三层·世界模型·连接表(骨架)
#
# 一条 link 描述两个场景之间一种"过场景"的方式。
#   a, b     场景名(必须存在于 scenes.yaml)
#   type     portal  走进地面传送圈/出入口(自动过图,识别"圈圈"点击/走入)
#            enter   进/出室内建筑(点门,室内无 Tab 小地图)
#            npc     对 NPC 对话选项传送(要写 via 与对话选项文字 opt)
#            post    驿站老板(多目的地菜单,见 posts 段)
#            earth   土地公公
#            stair   迷宫上下层
#            exit    出口形式未知(只知道必有出口和大致去向, 待录制确认)
#   bidir    true: 反向同样可走。a_at=在 a 里触发/落脚的位置, b_at=在 b 里触发/落脚的位置
#            false: 只能 a→b; a_at=在 a 里触发位置, b_at=到达 b 后的落脚位置
#   a_at/b_at [x,y] 游戏坐标, null = 待你填
#   ref      公开资料中的原始说法(**未经真机验证**, 仅供你填坐标时参考)
#   conf     A 官方明确 / B 多份攻略一致 / C 推测或资料互相冲突
#   conflict 有冲突时写明, 以真机实测为准
#   opt      NPC 对话选项文字(待你补, 用于 OCR 点击)
#
# 约定: 先把 a_at/b_at 填完, 再由 recorder 实测校正; 走路成本由规划器按坐标距离估算。

